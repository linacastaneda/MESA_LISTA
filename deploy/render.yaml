#Configuración opcional. Crearla en Render consume un plan de pago y disco.
#Al importar el Blueprint, indicar ruta: deploy/render.yaml.
services:
  - type: web
    name: mesalista
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/servir.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/reservas.sqlite3
      - key: COOKIE_SECURE
        value: '1'
      - key: DEMO_PASSWORD
        sync: false
    disk:
      name: reservas-datos
      mountPath: /var/data
      sizeGB: 1
